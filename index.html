<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Bracket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Single Elimination Bracket</h1>

<button id="resetBtn" class="reset-btn">Reset Tournament</button>

<div id="bracket"></div>

<script src="bracket.js"></script>
<script>
  async function loadData() {
    const res = await fetch("anime.csv");
    const text = await res.text();

    const lines = text.split("\n").filter(l => l.trim().length > 0);

    // Remove header row
    lines.shift();

    const entries = [];

    for (let index = 0; index < lines.length; index++) {
      const line = lines[index];

      const parts = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

      // Skip malformed lines
      if (!parts || parts.length < 3) {
        console.warn("Skipping bad CSV line", index + 2, line);
        continue;
      }

      const title = parts[0].replace(/^"|"$/g, "");
      const description = parts[1].replace(/^"|"$/g, "");
      const url = parts[2].replace(/^"|"$/g, "");

      entries.push({
        id: entries.length,
        name: title,
        description: description,
        youtube: url,
        status: "none"
      });
    }

    console.log("Loaded entries:", entries.length);
    initBracket(entries);
  }

  loadData();
</script>



</body>
</html>
